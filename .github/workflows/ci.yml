name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Notification ActionUrls must resolve to a served route
        run: node scripts/check-notification-targets.mjs
      - name: No unreachable client modules
        run: node scripts/check-client-reachability.mjs

  coordinator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - run: pnpm --dir Client install --frozen-lockfile
      - name: Read coordinator caps and coalesces correctly
        run: node scripts/check-request-coordinator.mjs

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Client
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: pnpm install
      - run: pnpm run build
      - name: Lint changed client files
        shell: bash
        run: |
          files=$(git diff --name-only origin/main...HEAD -- Client/src | grep -E '\.(ts|tsx)$' || true)
          if [ -n "$files" ]; then
            pnpm exec eslint $files
          else
            echo "No changed TypeScript client files to lint."
          fi

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.x'
      - run: dotnet restore PMWDS.slnx
      - run: dotnet build PMWDS.slnx --configuration Release --no-restore
      - run: dotnet test PMWDS.slnx --configuration Release --no-build
      - name: EF model must match the migration snapshot
        run: dotnet ef migrations has-pending-model-changes --project PMWDS.Persistence --startup-project PMWDS.Persistence
