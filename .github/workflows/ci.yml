name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Notification ActionUrls must resolve to a served route
        run: node scripts/check-notification-targets.mjs
      - name: No unreachable client modules
        run: node scripts/check-client-reachability.mjs

  coordinator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - run: pnpm --dir Client install --frozen-lockfile
      - name: Read coordinator caps and coalesces correctly
        run: node scripts/check-request-coordinator.mjs

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Client
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: pnpm install
      - name: Run the client linter
        run: pnpm run lint
      - run: pnpm run build

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.x'
      - name: Install EF CLI
        run: dotnet tool install --global dotnet-ef --version 10.0.7
      - run: dotnet restore PMWDS.slnx
      - name: Install dotnet-ef
        run: dotnet tool install --global dotnet-ef --version 10.0.7
      - run: dotnet build PMWDS.slnx --configuration Release --no-restore
      - run: dotnet test PMWDS.slnx --configuration Release --no-build
      - name: EF model must match the migration snapshot
        run: dotnet ef migrations has-pending-model-changes --project PMWDS.Persistence --startup-project PMWDS.Persistence

  browser:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: browser-tests
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: browser-tests/package.json
      - run: pnpm install
      - run: pnpm exec tsc --noEmit
      - run: pnpm exec playwright test --list
