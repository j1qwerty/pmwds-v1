name: Full role flow validation

on:
  push:
    branches: [test/full-role-business-flow]

jobs:
  full-role-flow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.x'
      - name: Install EF CLI
        run: dotnet tool install --global dotnet-ef --version 10.0.7
      - run: dotnet restore PMWDS.slnx
      - run: dotnet test PMWDS.slnx --configuration Release --filter "FullyQualifiedName~FullRoleBusinessFlowTests"
